name: Build & Publish Release

on:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
        DALAMUD_HOME: /tmp/dalamud
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get Tag Name
        run: echo "tag=$(echo ${{ github.ref }} | sed 's/refs\/tags\/v//')" >> $GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
          
      - name: Download Dalamud Latest
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -O ${{ env.DALAMUD_HOME }}.zip
          unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }}

      - name: Restore Project
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release CopeSeetheMeld/CopeSeetheMeld.csproj -p:AssemblyVersion=${{ env.tag }}

      - name: Build repo.json
        run: |
          jq --arg repo "https://github.com/${{ github.repository }}" \
             --arg zip "https://github.com/${{ github.repository }}/releases/download/v${{ env.tag }}/latest.zip" \
             '. + {RepoUrl: $repo, DownloadLinkInstall: $zip, DownloadLinkTesting: $zip, DownloadLinkUpdate: $zip}' \
             CopeSeetheMeld/bin/Release/CopeSeetheMeld/CopeSeetheMeld.json | jq -s '.' > repo.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.tag }}" \
            "CopeSeetheMeld/bin/Release/CopeSeetheMeld/latest.zip" \
            "repo.json" \
            --title "v${{ env.tag }}" \
            --generate-notes
